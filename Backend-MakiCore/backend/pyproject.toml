[project]
name = "backend"
version = "0.1.0"
description = "Backend de Maki Core: tienda de artesanías textiles del Valle del Mantaro."
readme = "README.md"
authors = [
    { name = "GinoTaipe", email = "gino_gjtm@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn>=0.54.0",
    "psycopg[binary,pool]>=3.2",
    "pyodbc>=5.5.0",
]

[project.scripts]
backend = "backend:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
