<nav class="navbar navbar-dark navbar-maki sticky-top shadow-sm">
  <div class="container flex-wrap gap-2 py-1">
    <span class="navbar-brand fw-bold d-flex align-items-center gap-2 mb-0">
      <i class="bi bi-flower1 text-warning"></i> Maki Core
    </span>

    <div class="d-flex flex-wrap gap-1">
      <button class="btn btn-sm nav-btn" [class.active]="pagina() === 'catalogo'" (click)="ir('catalogo')">
        <i class="bi bi-grid me-1"></i>Catálogo
      </button>
      <button class="btn btn-sm nav-btn" [class.active]="pagina() === 'carrito'" (click)="ir('carrito')">
        <i class="bi bi-bag me-1"></i>Carrito
        <span class="badge rounded-pill bg-warning text-dark">{{ tienda.totalPrendas() }}</span>
      </button>
      <button class="btn btn-sm nav-btn" [class.active]="pagina() === 'artesano'" (click)="ir('artesano')">
        <i class="bi bi-scissors me-1"></i>Artesano
      </button>
      <button class="btn btn-sm nav-btn" [class.active]="pagina() === 'login'" (click)="ir('login')">
        <i class="bi bi-person-circle me-1"></i>Ingresar
      </button>
    </div>

    <div class="btn-group btn-group-sm" role="group" aria-label="Moneda">
      <button
        class="btn"
        [class.btn-warning]="tienda.moneda() === 'USD'"
        [class.btn-outline-warning]="tienda.moneda() !== 'USD'"
        (click)="tienda.cambiarMoneda('USD')"
      >
        USD
      </button>
      <button
        class="btn"
        [class.btn-warning]="tienda.moneda() === 'EUR'"
        [class.btn-outline-warning]="tienda.moneda() !== 'EUR'"
        (click)="tienda.cambiarMoneda('EUR')"
      >
        EUR
      </button>
    </div>
  </div>
</nav>

<div class="container py-4">
  @if (tienda.estaLogueado()) {
    <p class="text-end small mb-3">
      <span class="badge rounded-pill text-bg-light border sesion-pill">
        <i class="bi bi-person-check me-1"></i>{{ tienda.usuario() }}
        <span class="text-capitalize text-primary">· {{ tienda.rol() }}</span>
      </span>
    </p>
  }

  <div [hidden]="pagina() !== 'catalogo'"><app-catalogo></app-catalogo></div>
  <div [hidden]="pagina() !== 'carrito'"><app-carrito></app-carrito></div>
  <div [hidden]="pagina() !== 'artesano'"><app-artesano></app-artesano></div>
  <div [hidden]="pagina() !== 'login'"><app-login></app-login></div>
</div>

@if (tienda.aviso() !== "") {
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div class="toast show toast-maki text-bg-dark border-0" role="status">
      <div class="toast-body">
        <i class="bi bi-bag-check text-warning me-2"></i>{{ tienda.aviso() }}
      </div>
    </div>
  </div>
}
