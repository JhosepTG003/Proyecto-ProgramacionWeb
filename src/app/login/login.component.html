<div class="row justify-content-center">
  <div class="col-md-8 col-lg-5">
    <div class="card card-maki shadow">
      <div class="card-body p-4">
        <div class="text-center mb-4">
          <div class="icono-circulo mx-auto mb-3"><i class="bi bi-person-fill"></i></div>
          <h3 class="card-title mb-1">Iniciar sesión</h3>
          <p class="text-muted small mb-0">Ingresa con tu correo para comprar o vender</p>
        </div>

        <div class="mb-3">
          <label class="form-label fw-semibold">Correo electrónico</label>
          <div class="input-group has-validation">
            <span class="input-group-text"><i class="bi bi-envelope"></i></span>
            <input
              type="email"
              class="form-control"
              placeholder="nombre@gmail.com"
              autocomplete="email"
              [class.is-invalid]="errorCorreo() !== ''"
              [class.is-valid]="correoOk()"
              [formField]="formulario.correo"
            />
            <div class="invalid-feedback">{{ errorCorreo() }}</div>
          </div>
        </div>

        <div class="mb-4">
          <label class="form-label fw-semibold">Contraseña</label>
          <div class="input-group has-validation">
            <span class="input-group-text"><i class="bi bi-lock"></i></span>
            <input
              [type]="verClave() ? 'text' : 'password'"
              class="form-control"
              placeholder="Mínimo 6 caracteres"
              autocomplete="current-password"
              [class.is-invalid]="errorClave() !== ''"
              [class.is-valid]="claveOk()"
              [formField]="formulario.clave"
            />
            <button
              class="btn btn-outline-secondary"
              type="button"
              [attr.aria-label]="verClave() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
              (click)="verClave.set(!verClave())"
            >
              <i class="bi" [class.bi-eye]="!verClave()" [class.bi-eye-slash]="verClave()"></i>
            </button>
            <div class="invalid-feedback">{{ errorClave() }}</div>
          </div>
        </div>

        <div class="d-grid gap-2 d-sm-flex">
          <button class="btn btn-primary w-100" (click)="entrar('comprador')">
            <i class="bi bi-bag me-1"></i> Comprador
          </button>
          <button class="btn btn-success w-100" (click)="entrar('artesano')">
            <i class="bi bi-scissors me-1"></i> Artesano
          </button>
        </div>

        <button
          class="btn btn-outline-danger w-100 mt-2"
          [hidden]="!tienda.estaLogueado()"
          (click)="salir()"
        >
          <i class="bi bi-box-arrow-right me-1"></i> Cerrar sesión
        </button>

        <div
          class="alert mt-3 mb-0 py-2"
          [class.alert-danger]="esError()"
          [class.alert-success]="!esError()"
          [hidden]="mensaje() === ''"
        >
          <i class="bi me-1" [class.bi-exclamation-circle]="esError()" [class.bi-check-circle]="!esError()"></i>
          {{ mensaje() }}
        </div>
      </div>
    </div>
  </div>
</div>
